
services:
  # FastAPI Backend
  - type: web
    name: mealmind-backend
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: DEEPSEEK_API_KEY
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USERNAME
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM_EMAIL
        sync: false

      - key: FRONTEND_URL
        fromService:
          type: web
          name: mealmind-frontend
          envVarKey: RENDER_EXTERNAL_URL

    # React + Vite Frontend
  - type: web
    name: mealmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mealmind-backend
          envVarKey: RENDER_EXTERNAL_URL
